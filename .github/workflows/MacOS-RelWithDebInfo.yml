name: RelWithDebInfo build on MacOS 

on:
  push:
    branches-ignore:
      - 'untested/**'
  pull_request:
    branches-ignore:
      - 'untested/**'

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: RelWithDebInfo
  CPP_COMPILER: clang++
  VULKAN_SDK_VERSION: 1.3.290.0

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: macos-latest

    steps:
    - name: Install build tools
      run: |
          export HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1
          brew update --quiet
          brew install --force --overwrite cmake llvm ninja lowdown

    - name: Setup Vulkan-SDK
      run: |
          wget "https://sdk.lunarg.com/sdk/download/${{env.VULKAN_SDK_VERSION}}/mac/vulkansdk-macos-${{env.VULKAN_SDK_VERSION}}.dmg" -O vulkan-sdk.dmg
          hdiutil attach vulkan-sdk.dmg
          sudo /Volumes/vulkansdk-macos-${{env.VULKAN_SDK_VERSION}}/InstallVulkan.app/Contents/MacOS/InstallVulkan --root ~/VulkanSDK/vulkansdk-macos-${{env.VULKAN_SDK_VERSION}} --accept-licenses --default-answer --confirm-command install
          hdiutil detach /Volumes/vulkansdk-macos-${{env.VULKAN_SDK_VERSION}}
          

    - name: Git Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: |
          export VULKAN_SDK_PATH=~/VulkanSDK/vulkansdk-macos-${{env.VULKAN_SDK_VERSION}}
          export VULKAN_SDK=$VULKAN_SDK_PATH/macOS
          export Vulkan_LIBRARY=$VULKAN_SDK/lib
          export Vulkan_INCLUDE_DIR=$VULKAN_SDK/include
          export PATH=$VULKAN_SDK/bin:$PATH
          mkdir ${{github.workspace}}/build
          cd ${{github.workspace}}/build
          cmake -G Ninja -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_CXX_COMPILER:FILEPATH=${{env.CPP_COMPILER}} -S ${{github.workspace}}

    - name: Build
      # Build your program with the given configuration
      run: | 
          cd ${{github.workspace}}/build
          ninja

    - name: Test
      working-directory: ${{github.workspace}}/build
      # Execute tests defined by the CMake configuration.
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest -C ${{env.BUILD_TYPE}}

