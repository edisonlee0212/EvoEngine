name: clang-format Check
on: [push, pull_request]
jobs:
  formatting-check:
    name: Formatting Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pinned clang-format
      run: python -m pip install "clang-format==$(cat .clang-format-version)"
    - name: Run repository clang-format check
      run: python Scripts/format_cpp.py --check
